name: release

on:
  # Every push to main or dev that passes its checks dry-runs the release.
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main, dev]

  # Releases for real, from main.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # trusted publishing to npm

concurrency:
  # Under workflow_run, github.ref is always the default branch.
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'main' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      # Installs dependencies, for npm/publish's prepublishOnly builds.
      - uses: pnpm/setup@v3
        with:
          cache: true

      - uses: ./
        with:
          dry-run: ${{ env.DRY_RUN }}
          # `npx rylease` is rylease's shim, which runs @rylease/cli.
          components: |
            - { name: rylease, path: ., tag: "v{version}" }
            - { name: "@rylease/cli", path: packages/cli, dependsOn: [rylease] }
          history: "[git/tags, { uses: fs/version-file, with: { format: npm } }]"
          steps: |
            - uses: fs/write-version
              with: { format: npm }
            - uses: fs/write-changes
            - uses: git/commit
            - uses: conventional
            # A new major of rylease is out of the CLI's range for it.
            - uses: components/dependents
              with: { on: [breaking] }
            # The action's floating tag, e.g. v3; not the CLI's.
            - uses: exec/command
              if: component.name == 'rylease' && channel == null
              with:
                phase: release
                command: git tag -f v{major} && git push -f origin v{major}
            - uses: npm/publish
