name: check

on:
  push:
    
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: pnpm/setup@v3
        with:
          cache: true
      
      - run: pnpm biome ci
      
      - run: pnpm typecheck
      
      - run: pnpm test
      
      - run: |
          pnpm build
          pnpm --filter @rylease/cli build
      
      - run: |
          pnpm build:action
          pnpm build:docs
          git diff --exit-code dist/action.mjs README.md

  smoketest:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Create test project
        run: |
          git init -b main fixture
          cd fixture
          git config user.name test
          git config user.email test@example.com
          echo '{ "name": "fixture", "version": "1.0.0", "type": "module" }' > package.json
          mkdir release
          cat > release/hello.ts <<'TS'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { defineStep, z } from "rylease";
          export default defineStep({
            phase: "release",
            name: "hello",
            options: { to: z.string() },
            run: ({ env, version, options }) => {
              const reason = `hello ${options.to}, from ${version}`;
              // Proves the step's condition held; a dry run would otherwise leave no trace.
              writeFileSync(join(env.cwd, "hello.txt"), reason);
              return { output: null, reason };
            },
          });
          TS
          git add -A
          git commit -m "chore: init"
          git tag v1.0.0
          git commit --allow-empty -m "feat: something"
          
      - id: release
        uses: ./
        with:
          working-directory: fixture
          dry-run: true
          steps: |
            - uses: fs/write-version
              with: { format: npm }
            - uses: git/commit
            - uses: conventional
              with:
                github/create-release: { repo: me/fixture }
            - uses: npm/publish
            - uses: ./release/hello.ts
              if: version == '1.1.0' && steps['conventional/determine-kind'].output.kind == 'feature'
              with:
                to: ci
            # Would fail: the fixture has no remote to release to.
            - uses: github/upload-release-assets
              if: "!dryRun"
              with:
                files: [package.json]
        
      - name: Check test result
        env:
          STATUS: ${{ steps.release.outputs.status }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$STATUS" = released
          test "$VERSION" = 1.1.0
          test "$(cat fixture/hello.txt)" = "hello ci, from 1.1.0"

  # Uploads for real what a dry run keeps, as a later job of a release would.
  smoketest-upload:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Create test files
        run: |
          mkdir -p fixture/dist/nested
          echo linux > "fixture/dist/app linux"
          echo windows > fixture/dist/app.exe
          echo '{}' > fixture/dist/nested/latest.json
      
      - id: upload
        uses: ./
        with:
          working-directory: fixture
          version: 1.2.0
          dry-run: true
          scheme: semver
          history: git/tags
          steps: |
            - uses: github/upload-release-assets
              with:
                files: ["dist/app*"]
                dryRunArtifact: true
                artifactName: smoketest-assets-{version}
            - uses: github/upload-artifact
              with:
                name: smoketest-dist
                files: [dist]
                dryRunArtifact: true
                retentionDays: 1
      
      - uses: actions/download-artifact@v8
        with:
          name: smoketest-assets-1.2.0
          path: assets
      
      - uses: actions/download-artifact@v8
        with:
          name: smoketest-dist
          path: dist
      
      - name: Check artifacts
        env:
          STATUS: ${{ steps.upload.outputs.status }}
        run: |
          test "$STATUS" = released
          test "$(cat "assets/app linux")" = linux
          test "$(cat assets/app.exe)" = windows
          test "$(cat dist/nested/latest.json)" = '{}'
          test "$(cat dist/app.exe)" = windows
